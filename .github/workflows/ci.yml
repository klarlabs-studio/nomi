# Thin caller for the shared klarlabs-studio Go CI bar.
# All gate logic lives in the reusable workflow — bump versions / add
# jobs there, once, org-wide.
#
# Scope: Go core (reusable org workflow) plus the JS/TS frontend under
# app/. Nomi is a Tauri desktop app (Go daemon + React + Rust via
# app/src-tauri/). The Go module is at the repo root. The multi-OS
# Tauri bundle build lives in release.yml.
#
# coverage: false      — no coverage threshold wired up yet (follow-up).
# cross-platform: false — the Go core is platform-agnostic; the multi-OS
#                         build stays in release.yml. Lint/test on ubuntu.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # shared security job posts nox annotations on PRs
    secrets: inherit
    with:
      # go.mod requires >= 1.26.2; setup-go pins GOTOOLCHAIN=local, so the
      # shared default can't auto-download a newer toolchain.
      go-version: "1.26"
      # The org-pinned golangci-lint must be built with go1.26 to lint a
      # go1.26.2 module ("build Go version is lower than the targeted Go
      # version"); v2.12.2 is.
      golangci-version: "v2.12.2"
      coverage: false      # no coverage threshold wired up yet (follow-up)
      cross-platform: false

  frontend:
    name: Frontend lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install JS deps
        working-directory: app
        run: npm ci
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Unit tests
        working-directory: app
        run: npm run test:unit

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install deps
        working-directory: extensions/vscode
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        working-directory: extensions/vscode
        run: npm run lint
      - name: Unit tests
        working-directory: extensions/vscode
        run: npm test
      - name: Compile
        working-directory: extensions/vscode
        run: npm run compile

  # Branch protection requires commit status "warden/gate" (normally posted
  # by local `warden` when status.enabled is true). Cloud-agent pushes skip
  # that hook, so the check stays "expected" forever and blocks merge even
  # when Actions is green. Publish the pointer after CI succeeds; the
  # Actions jobs remain the real evidence.
  warden-gate:
    name: Publish warden/gate
    needs: [ci, frontend, vscode-extension]
    runs-on: ubuntu-latest
    if: success()
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Post warden/gate success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          gh api --method POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=success \
            -f context=warden/gate \
            -f description='CI green (lint/test/vulns via Actions)' \
            -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
